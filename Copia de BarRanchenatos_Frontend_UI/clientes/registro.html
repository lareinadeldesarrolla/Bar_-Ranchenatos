<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de clientes | Bar Ranchenatos</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tema.css">
    <link rel="stylesheet" href="../css/cliente.css">
</head>

<body class="tema cliente-acceso">

    <main class="cliente-contenedor">

        <header class="cliente-marca">
            <a href="../index.html">
                <img src="../assets/ranchenatos_isotipo.svg" alt="Logo Bar Ranchenatos">
            </a>
            <p>RANCHENATOS</p>
            <span>Tradición, sabor y buenos momentos</span>
        </header>

        <section class="cliente-panel">

            <div class="cliente-encabezado">
                <h1>¡Bienvenido!</h1>
                <p>Regístrate y disfruta de nuestros servicios.</p>
            </div>

            <form id="form-registro" class="cliente-formulario">

                <div class="campo-cliente">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" maxlength="100"
                        autocomplete="name" required>
                </div>

                <div class="campo-cliente">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Tu número de contacto" maxlength="15"
                        autocomplete="tel" required>
                </div>

                <div class="campo-cliente">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" maxlength="120"
                        autocomplete="email" required>
                </div>

                <p id="mensaje-registro" class="mensaje-cliente" aria-live="polite"></p>

                <button type="submit" class="btn-cliente">
                    Registrarme
                </button>

            </form>

            <div class="cliente-registro">
                <p>¿Ya tienes una cuenta?</p>
                <a href="ingreso.html">Iniciar sesión</a>
            </div>

        </section>

        <footer class="cliente-pie">
            <a href="../index.html">Volver al inicio</a>
            <p>Bar Ranchenatos · Vive la tradición</p>
        </footer>

    </main>

    <script src="../js/registro.js"></script>

</body>

</html>
